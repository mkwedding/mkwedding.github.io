<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Find your wedding photo folder.">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Wedding Photos</title>
    <link rel="stylesheet" href="styles.css?v=20260822-2">
    <script src="app.js?v=20260822-2" defer></script>
  </head>
  <body>
    <main class="shell">
      <h1>Wedding photos</h1>
      <div class="search-box">
        <label for="name-search">Find your folder</label>
        <input id="name-search" type="search" placeholder="Type your name" autocomplete="off"
          role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>
      <section aria-label="Photo folders">
        <div id="folder-grid" class="folder-grid"></div>
        <p id="empty" class="empty">Folders will appear here once the photos are ready.</p>
      </section>
    </main>
  </body>
</html>
