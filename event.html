<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#3a1806">
    <title>Wedding Photos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="styles.css?v=20261104-7">
    <script src="gallery.js?v=20261104-7" defer></script>
  </head>
  <body class="gallery-page">
    <main class="gallery-shell">
      <nav class="crumb">
        <a href="./" class="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          <span>All events</span>
        </a>
      </nav>
      <header class="gallery-head">
        <h1 id="event-title">&nbsp;</h1>
        <p id="event-meta" class="gallery-meta"></p>
        <a id="originals" class="originals" target="_blank" rel="noreferrer" hidden>Download originals</a>
      </header>
      <div id="grid" class="photo-grid"></div>
      <p id="status" class="empty" hidden></p>
    </main>

    <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
      <div class="viewer-bar">
        <span id="viewer-count" class="viewer-count"></span>
        <div class="viewer-actions">
          <a id="viewer-download" class="viewer-btn" download aria-label="Download this photo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          </a>
          <button id="viewer-close" class="viewer-btn" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
      <div id="viewer-stage" class="viewer-stage">
        <img id="viewer-img" alt="">
      </div>
      <button id="viewer-prev" class="viewer-nav prev" type="button" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="viewer-next" class="viewer-nav next" type="button" aria-label="Next photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </body>
</html>
